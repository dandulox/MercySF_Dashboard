<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mercy SF — Setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
<script>
  (function () {
    var t = localStorage.getItem('mercy-theme');
    if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    background:
      radial-gradient(circle at 18% 20%, rgba(79,140,255,0.10), transparent 42%),
      radial-gradient(circle at 82% 78%, rgba(53,201,143,0.08), transparent 42%),
      var(--bg);
  }

  .auth-card {
    width: 100%;
    max-width: 460px;
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 34px 32px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.02) inset;
    position: relative;
    overflow: hidden;
  }
  .auth-card::before {
    content: '';
    position: absolute;
    top: -90px; left: -90px;
    width: 220px; height: 220px;
    background: radial-gradient(circle, rgba(79,140,255,0.28), transparent 70%);
    pointer-events: none;
  }

  .auth-header { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; position: relative; }
  .auth-icon {
    width: 44px; height: 44px; flex-shrink: 0;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #7a5cff);
    display: flex; align-items: center; justify-content: center;
    font-size: 21px;
    box-shadow: 0 6px 16px rgba(79,140,255,0.35);
  }
  .auth-title { margin: 0; font-size: 19px; font-weight: 700; }
  .auth-subtitle { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.5; }

  .field { margin-bottom: 16px; position: relative; }
  .field label {
    display: block; margin-bottom: 6px; font-size: 11px; font-weight: 700;
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em;
  }
  .field input[type="text"], .field input[type="password"] {
    width: 100%; box-sizing: border-box;
    background: var(--input-bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 11px 13px;
    font-size: 14px;
    transition: border-color .15s, box-shadow .15s;
  }
  .field input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79,140,255,0.18);
  }
  .password-wrap { position: relative; }
  .password-wrap input { padding-right: 42px; }
  .password-toggle {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; font-size: 16px;
    opacity: 0.6; padding: 6px; line-height: 1;
  }
  .password-toggle:hover { opacity: 1; }

  .btn-primary-lg {
    width: 100%; margin-top: 6px; padding: 12px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #7a5cff);
    color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
    box-shadow: 0 8px 22px rgba(79,140,255,0.32);
    transition: transform .1s, box-shadow .15s, opacity .15s;
  }
  .btn-primary-lg:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 10px 26px rgba(79,140,255,0.42); }
  .btn-primary-lg:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; transform: none; }

  .btn-secondary {
    width: 100%; margin-top: 10px; padding: 11px; border: 1px solid var(--border);
    border-radius: 10px; background: transparent; color: var(--text);
    font-weight: 600; font-size: 13px; cursor: pointer; transition: border-color .15s, color .15s;
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

  .secret-block { background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-top: 14px; }
  .secret-block-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 10px; }
  .secret-block h3 { margin: 0; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
  .secret-value {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 13px; word-break: break-all; line-height: 1.7; color: var(--text);
  }
  .copy-btn {
    flex-shrink: 0; background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 4px 10px; font-size: 11px; font-weight: 600; cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .copy-btn.copied { border-color: var(--green); color: var(--green); }

  .word-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .word-chip {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 9px; font-family: "SFMono-Regular", Consolas, monospace; font-size: 13px;
    display: flex; align-items: baseline; gap: 6px;
  }
  .word-chip .word-index { color: var(--muted); font-size: 10px; min-width: 12px; }

  .warning-banner {
    display: flex; gap: 10px; align-items: flex-start;
    background: rgba(240,180,41,0.09); border: 1px solid rgba(240,180,41,0.32);
    border-radius: 10px; padding: 12px 14px; margin-top: 16px; font-size: 12.5px;
    color: #f0b429; line-height: 1.5;
  }
  .warning-banner .icon { flex-shrink: 0; font-size: 15px; }

  .confirm-row {
    display: flex; align-items: flex-start; gap: 9px; margin-top: 18px; font-size: 13px;
    line-height: 1.4; color: var(--text);
  }
  .confirm-row input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; margin-top: 1px; cursor: pointer; }
  .confirm-row label { cursor: pointer; }

  .error-text { color: var(--red); font-size: 13px; margin-top: 10px; }
  .muted { color: var(--muted); font-size: 13px; line-height: 1.5; }

  @media print {
    body { background: #fff !important; display: block; padding: 0; min-height: 0; }
    .no-print { display: none !important; }
    .auth-card { box-shadow: none; border: 1px solid #ccc; background: #fff; color: #000; max-width: 100%; border-radius: 0; padding: 0; }
    .auth-card::before { display: none; }
    .secret-block { background: #fff; border: 1px solid #999; }
    .secret-value, .secret-block h3 { color: #000 !important; }
    .word-chip { background: #fff; border: 1px solid #ccc; color: #000; }
    .word-chip .word-index { color: #888; }
    .warning-banner { color: #7a5c00; background: #fff8e0; border-color: #d9a900; }
    a { display: none; }
  }
</style>
</head>
<body>
  <div class="auth-card" id="card">
    <div class="auth-header">
      <div class="auth-icon">⚔</div>
      <div>
        <h1 class="auth-title" data-i18n="setup.title">Zugang einrichten</h1>
        <p class="auth-subtitle" data-i18n="setup.subtitle">Noch kein Zugang vorhanden — lege jetzt den einzigen Admin-Zugang für dieses Dashboard an.</p>
      </div>
    </div>
    <form id="setup-form">
      <div class="field">
        <label for="username" data-i18n="setup.username">Benutzername</label>
        <input type="text" id="username" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="password" data-i18n="setup.password">Passwort</label>
        <input type="password" id="password" required minlength="8" autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="password2" data-i18n="setup.passwordRepeat">Passwort wiederholen</label>
        <input type="password" id="password2" required minlength="8" autocomplete="new-password" />
      </div>
      <div id="setup-error" class="error-text" hidden></div>
      <button type="submit" class="btn-primary-lg" data-i18n="setup.submit">Zugang anlegen</button>
    </form>
    <button type="button" class="icon-btn lang-toggle-btn" id="lang-toggle-btn" style="position:absolute;top:14px;right:14px;">DE</button>
  </div>
  <script type="module" src="/setup.js"></script>
</body>
</html>
