<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mercy SF — Anmelden</title>
<link rel="stylesheet" href="/style.css" />
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .auth-card { width: 100%; max-width: 480px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 32px; margin: 20px; }
  .auth-card h1 { margin-top:0; font-size: 20px; }
  .auth-card label { display:block; margin: 12px 0 4px; font-size: 13px; color: var(--muted); }
  .auth-card input[type="text"], .auth-card input[type="password"] { width:100%; box-sizing:border-box; background: var(--panel-2); border:1px solid var(--border); color: var(--text); border-radius:6px; padding:8px 10px; }
  .auth-card .btn { margin-top:20px; width:100%; }
  .link-btn { background:none; border:none; color: #4f8cff; cursor:pointer; font-size:13px; padding:0; margin-top:14px; }
  .word-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin-top:8px; }
  .word-grid input { background: var(--panel-2); border:1px solid var(--border); color: var(--text); border-radius:6px; padding:6px 8px; text-align:center; }
  .secret-block { background: var(--panel-2); border:1px solid var(--border); border-radius:8px; padding:14px; margin-top:14px; font-family: monospace; word-break: break-all; }
  .secret-block h3 { margin:0 0 8px; font-size:13px; color: var(--muted); font-family: inherit; }
  .confirm-row { display:flex; align-items:flex-start; gap:8px; margin-top:20px; font-size:13px; }
  .error-text { color: var(--red); font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>
  <div class="auth-card" id="card">
    <h1>⚔ Mercy SF — Anmelden</h1>
    <form id="login-form">
      <label for="username">Benutzername</label>
      <input type="text" id="username" required autocomplete="username" />
      <label for="password">Passwort</label>
      <input type="password" id="password" required autocomplete="current-password" />
      <div id="login-error" class="error-text" hidden></div>
      <button type="submit" class="btn btn-primary">Anmelden</button>
    </form>
    <button type="button" class="link-btn" id="forgot-btn">Zugangsdaten vergessen?</button>

    <form id="reset-form" hidden>
      <p class="muted">Gib deinen 12-Wort-Wiederherstellungsschlüssel ein.</p>
      <div class="word-grid" id="word-grid"></div>
      <label for="new-password">Neues Passwort</label>
      <input type="password" id="new-password" required minlength="8" autocomplete="new-password" />
      <label for="new-password2">Neues Passwort wiederholen</label>
      <input type="password" id="new-password2" required minlength="8" autocomplete="new-password" />
      <div id="reset-error" class="error-text" hidden></div>
      <button type="submit" class="btn btn-primary">Passwort zurücksetzen</button>
      <button type="button" class="link-btn" id="back-to-login-btn">Zurück zum Login</button>
    </form>
  </div>
  <script type="module" src="/login.js"></script>
</body>
</html>
