services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: mercy-dashboard:latest
    container_name: dashboard
    networks:
      - mercy-net
    ports:
      - "8080:8080"
    volumes:
      - mercy_dashboard_data:/app/data
      - mercy_certs:/app/certs
      # CLI binary + the CLI's own data (analytics, credentials.json) — lib/{cliExec,cliUpdate,
      # discoveryLogin,ptyManager}.js hard-code /opt/mercy/mercy-cli-linux-x64 and cwd /opt/mercy
      # with no env override, so this path is not optional (see docker/entrypoint-dashboard.sh).
      - mercy_cli_data:/opt/mercy
      # The CLI itself writes its actual per-account data (analytics/battle_history/characters/
      # its own credentials.json) to $HOME/.config/mercy-sf, not under /opt/mercy — os.homedir()
      # resolves to /root for the container's root user. Without this volume that data lives only
      # in the container's writable layer and is lost on `docker compose up --force-recreate` /
      # image rebuilds, even though /opt/mercy and /app/data survive those.
      - mercy_cli_home:/root/.config/mercy-sf
    restart: unless-stopped

  sfapi-bridge:
    build:
      context: .
      dockerfile: Dockerfile.sfapi-bridge
    image: mercy-sfapi-bridge:latest
    container_name: sfapi-bridge
    network_mode: "service:dashboard"
    depends_on:
      - dashboard
    restart: unless-stopped

networks:
  mercy-net:
    driver: bridge

volumes:
  mercy_dashboard_data:
  mercy_certs:
  mercy_cli_data:
  mercy_cli_home:
